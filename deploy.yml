- name: Deploy Car Rental Platform
  hosts: localhost
  become: yes
  vars:
    app_name: my-angular-app
    build_dir: ./dist
    nginx_root: /var/www/my-angular-app
    project_root: "{{ playbook_dir }}"  # Jenkins workspace root, ahol package.json van
    backend_script: "start-server"      # npm script a backend indításához

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Node.js 20
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
        apt-get install -y nodejs
      args:
        executable: /bin/bash

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx service is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Install project dependencies (frontend + backend)
      npm:
        path: "{{ project_root }}"
        production: no

    - name: Build Angular frontend
      command: npm run build -- --configuration production
      args:
        chdir: "{{ project_root }}"

    - name: Create web root directory
      file:
        path: "{{ nginx_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy Angular build to Nginx root
      copy:
        src: "{{ build_dir }}/"
        dest: "{{ nginx_root }}/"
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Start backend with PM2
      shell: |
        pm2 start npm --name backend -- run {{ backend_script }} || pm2 restart backend
        pm2 save
      args:
        chdir: "{{ project_root }}"

    - name: Configure Nginx for Angular SPA
      copy:
        src: "{{ playbook_dir }}/nginx.conf"
        dest: /etc/nginx/sites-available/{{ app_name }}
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/{{ app_name }}
        dest: /etc/nginx/sites-enabled/{{ app_name }}
        state: link
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

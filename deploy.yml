---
- name: Deploy Angular app with Nginx
  hosts: localhost
  become: yes
  vars:
    app_name: my-angular-app
    build_dir: "/mnt/c/ProgramData/Jenkins/.jenkins/workspace/CarRentalPlatform (pipeline)/dist/my-angular-app"
    nginx_root: /var/www/my-angular-app
    nginx_conf_src: "{{ playbook_dir }}/nginx.conf"

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure Nginx service is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Create web root directory
      file:
        path: "{{ nginx_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy Angular build to Nginx root
      copy:
        src: "{{ build_dir }}/"
        dest: "{{ nginx_root }}/"
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Ensure correct permissions recursively
      file:
        path: "{{ nginx_root }}"
        state: directory
        recurse: yes
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy custom Nginx config
      copy:
        src: "{{ nginx_conf_src }}"
        dest: /etc/nginx/sites-available/{{ app_name }}
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/{{ app_name }}
        dest: /etc/nginx/sites-enabled/{{ app_name }}
        state: link
      notify: Reload Nginx

    - name: Remove default site (optional, elkerüli az ütközést)
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

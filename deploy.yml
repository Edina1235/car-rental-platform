- name: Deploy Angular app with Nginx
  hosts: localhost
  become: yes 
  vars:
    app_name: my-angular-app
    build_dir: ./dist
    nginx_root: /var/www/my-angular-app
    backend_dir: ./backend

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Ensure Nginx service is started and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Create web root directory
      file:
        path: "{{ nginx_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Copy Angular build to Nginx root
      copy:
        src: "{{ build_dir }}/"
        dest: "{{ nginx_root }}/"
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Create backend directory
      file:
        path: /var/www/backend
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Upload backend files
      copy:
        src: "{{ backend_dir }}/"
        dest: /var/www/backend/
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Install backend dependencies
      npm:
        path: /var/www/backend
        production: yes

    - name: Start backend with PM2
      shell: |
        pm2 start server.js --name backend || pm2 restart backend
        pm2 save

    - name: Configure Nginx for Angular SPA
      copy:
        src: "{{ playbook_dir }}/nginx.conf"
        dest: /etc/nginx/sites-available/{{ app_name }}
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/{{ app_name }}
        dest: /etc/nginx/sites-enabled/{{ app_name }}
        state: link
      notify: Reload Nginx

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

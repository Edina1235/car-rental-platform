- name: Deploy Car Rental Platform
  hosts: localhost
  become: yes
  vars:
    app_name: car-rental-platform
    project_root: "{{ playbook_dir }}"
    build_dir: "{{ project_root }}/dist/car-rental-platform"
    nginx_root: /var/www/car-rental-platform
    pm2_user: "{{ ansible_user | default('p_liteook') }}"
    mongodb_uri: "{{ 'mongodb+srv://carRental:carRental123@cluster0.stbcjzc.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0' | default('') }}"

  tasks:
    - name: Ensure apt cache is updated
      apt:
        update_cache: yes

    - name: Install prerequisite packages
      apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - nginx
          - rsync
          - tar
        state: present

    - name: Ensure nginx is running
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Install pm2 globally
      npm:
        name: pm2
        global: yes
        state: present
      environment:
        PATH: /usr/bin:/usr/local/bin:/bin

    - name: Create ngnix root dir
      file:
        path: "{{ nginx_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Sync Angular build to nginx root
      synchronize:
        src: "{{ build_dir }}/"
        dest: "{{ nginx_root }}/"
      delegate_to: localhost
      
    - name: Sync package.json
      synchronize:
        src: "{{ project_root }}/package.json"
        dest: "{{ nginx_root }}/backend"
      delegate_to: localhost

    - name: Sync node_modules
      synchronize:
        src: "{{ project_root }}/node_modules"
        dest: "{{ nginx_root }}/backend"
      delegate_to: localhost

    - name: Ensure nginx root ownership and permissions
      file:
        path: "{{ nginx_root }}"
        recurse: yes
        owner: www-data
        group: www-data

    - name: Upload templated ecosystem to project root
      template:
        src: ecosystem.config.js
        dest: "{{ project_root }}/ecosystem.config.js"
        owner: "{{ pm2_user }}"
        group: "{{ pm2_user }}"
        mode: '0644'

    - name: Start / restart backend with PM2 using ecosystem
      become: yes
      become_user: "{{ pm2_user }}"
      shell: |
        {% if mongodb_uri != "" %}
        export MONGODB_URI="{{ mongodb_uri }}"
        {% endif %}
        pm2 delete backend || true
        # Indítás relatív útvonallal a project_root alapján (kikerüli a szóköz/parsing hibákat)
        pm2 start ecosystem.config.js --env production
        pm2 save
      args:
        chdir: "{{ project_root }}"
      environment:
        PATH: /usr/bin:/usr/local/bin:/bin

    - name: Copy nginx site file
      copy:
        src: "{{ playbook_dir }}/nginx.conf"
        dest: "/etc/nginx/sites-available/{{ app_name }}"
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx

    - name: Enable nginx site
      file:
        src: "/etc/nginx/sites-available/{{ app_name }}"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}"
        state: link
        force: yes
      notify: Reload Nginx

    - name: Test nginx configuration
      command: nginx -t
      register: nginx_test
      failed_when: nginx_test.rc != 0
      changed_when: false

    - name: Reload nginx
      service:
        name: nginx
        state: reloaded

  handlers:
    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded
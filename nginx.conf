server {
    listen 80;
    server_name _;

    root /var/www/car-rental-platform;
    index index.html;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api {
        proxy_pass http://127.0.0.1:3000/api;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}